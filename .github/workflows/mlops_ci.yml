name: Jali MLOps CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
  TRIGGER_TYPE:        github_push

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Lint and basic validation (runs on every push and PR)
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8

      - name: Run flake8 on mlops, models, pipelines
        run: |
          flake8 mlops/ models/ pipelines/ \
            --max-line-length 120 \
            --exclude=__pycache__,.venv,venv

  # --------------------------------------------------------------------------
  # Job 2: Retrain models in Snowflake (only on push to main, not PRs)
  # --------------------------------------------------------------------------
  retrain:
    name: Snowpark Retraining
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MLOps dependencies
        run: pip install -r mlops/requirements_mlops.txt

      - name: Run Snowpark retraining (all pillars)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python mlops/snowpark_trainer.py --source snowflake --pillar all

      - name: Log training run status
        if: always()
        run: |
          echo "Retraining job completed. Check MLOPS.MODEL_METRICS in Snowflake for results."
